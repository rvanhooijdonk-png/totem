name: CI

# Rigorously verify every change before it lands: typecheck + full test suite +
# build, on every push to main AND every pull request. A red check here blocks
# the merge button, so nothing unverified reaches main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # standaard alleen lezen (I3); jobs die meer nodig hebben zetten dat zelf

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx tsc
